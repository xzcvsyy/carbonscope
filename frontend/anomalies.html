<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CarbonScope — Anomalies</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #F8F8F5;
    --card: #FFFFFF;
    --border: #ECEBE3;
    --accent: #9A8D14;
    --accent-tint: #FBF6CF;
    --accent-hover-border: #D8CF7A;
    --accent-shadow: rgba(154,141,20,0.10);
    --ink: #111827;
    --muted: #6B6F76;
    --faint: #9A9C9F;
    --alert: #FF6B57;
    --header-line: #ECECEC;
    --button-bg: #FFFFFF;
    --button-border: #E5E3D6;
    --button-hover-bg: #FAF8E6;
    --avatar: #111827;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: var(--card);
    color: var(--ink);
    padding: calc(0px + env(safe-area-inset-top, 0px)) 0 calc(0px + env(safe-area-inset-bottom, 0px));
  }


  .header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 18px 32px;
    border-bottom: 1px solid var(--header-line);
    gap: 16px;
    flex-wrap: wrap;
    max-width: 1400px;
    margin: 0 auto;
  }
  .brand { display: flex; align-items: center; gap: 10px; }
  .logo-placeholder { width: 32px; height: 32px; border-radius: 8px; flex-shrink: 0; display: block; }
  .brand-name {
    font-size: 20px;
    font-weight: 700;
    letter-spacing: -0.5px;
    color: var(--ink);
  }
  .brand-name .accent { color: var(--accent); }
  .nav { display: flex; align-items: center; gap: 8px; font-size: 14px; }
  .nav a {
    text-decoration: none; color: var(--muted); padding: 8px 14px; border-radius: 20px;
    transition: background 0.15s ease, color 0.15s ease;
  }
  .nav a:hover { color: var(--ink); }
  .nav a.active { font-weight: 600; color: var(--accent); background: var(--accent-tint); }
  .avatar { width: 34px; height: 34px; border-radius: 50%; background: var(--avatar); flex-shrink: 0; }


  .page {
    max-width: 1120px;
    margin: 0 auto;
    padding: 40px 32px 60px;
  }

  .page-head {
    display: flex; justify-content: space-between; align-items: flex-start;
    gap: 16px; margin-bottom: 32px; flex-wrap: wrap;
  }
  .page-title { font-size: 26px; font-weight: 800; margin: 0 0 6px; }
  .page-sub { font-size: 14px; color: var(--muted); margin: 0; }

  button.export {
    background: var(--button-bg); color: var(--ink); border: 1px solid var(--button-border); border-radius: 20px;
    padding: 10px 18px; font-size: 14px; font-weight: 600; font-family: inherit; cursor: pointer;
    white-space: nowrap; transition: background 0.15s ease, border-color 0.15s ease;
  }
  button.export:hover { background: var(--button-hover-bg); border-color: var(--accent); }
  button.export:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 20px;
  }

  .anomaly-card {
    border: 1px solid var(--border); border-radius: 14px; padding: 24px;
    background: var(--card); cursor: default;
    transition: border-color 0.15s ease, box-shadow 0.15s ease;
  }
  .anomaly-card:hover { border-color: var(--accent-hover-border); box-shadow: 0 4px 18px var(--accent-shadow); }

  .anomaly-top { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 12px; gap: 12px; }
  .anomaly-id { font-size: 14px; font-weight: 700; }
  .anomaly-kg { font-size: 22px; font-weight: 800; color: var(--alert); white-space: nowrap; }

  .anomaly-desc { font-size: 14px; line-height: 1.6; color: var(--muted); margin: 0 0 16px; }

  .anomaly-meta { display: flex; gap: 16px; font-size: 12px; color: var(--faint); }

  .api-error { display: none; margin-bottom: 20px; padding: 12px 16px; border-radius: 10px; font-size: 13px; color: var(--alert); border: 1px solid var(--alert); }
  .empty-note { text-align: center; font-size: 13px; color: var(--faint); padding: 40px 0; }

  @media (max-width: 760px) {
    .grid { grid-template-columns: 1fr; }
    .header { padding: 16px 20px; }
    .page { padding: 28px 20px 40px; }
    .page-title { font-size: 22px; }
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #16160F; --card: #1E1E15; --border: #36362A;
      --accent: #D4C73A; --accent-tint: #3A3614; --accent-hover-border: #6B6420;
      --accent-shadow: rgba(212,199,58,0.12);
      --ink: #F5F4EA; --muted: #B0AE9A; --faint: #8C8A78; --alert: #FF8A78;
      --header-line: #36362A; --button-bg: #26261B; --button-border: #36362A;
      --button-hover-bg: #2E2E20; --avatar: #F5F4EA;
    }
  }
  :root[data-theme="dark"] {
    --bg: #16160F; --card: #1E1E15; --border: #36362A;
    --accent: #D4C73A; --accent-tint: #3A3614; --accent-hover-border: #6B6420;
    --accent-shadow: rgba(212,199,58,0.12);
    --ink: #F5F4EA; --muted: #B0AE9A; --faint: #8C8A78; --alert: #FF8A78;
    --header-line: #36362A; --button-bg: #26261B; --button-border: #36362A;
    --button-hover-bg: #2E2E20; --avatar: #F5F4EA;
  }
</style>
</head>
<body>

  <!-- Header -->
  <div class="header">
    <div class="brand">
      <img src="carbonscope-icon.svg" alt="CarbonScope logo" class="logo-placeholder">
      <span class="brand-name">Carbon<span class="accent">Scope</span></span>
    </div>
    <div class="nav">
      <a href="index.html">Estimate</a>
      <a href="anomalies.html" class="active">Anomalies</a>
      <a href="reports.html">Reports</a>
    </div>
    <div class="avatar"></div>
  </div>

  <!-- Page content -->
  <div class="page">
    <div class="page-head">
      <div>
        <h1 class="page-title">Flagged anomalies</h1>
        <p class="page-sub">Records Isolation Forest identified as unusual relative to the rest of the dataset.</p>
      </div>
      <button class="export" id="exportBtn">Export flagged</button>
    </div>

    <div class="api-error" id="apiError"></div>
    <div class="grid" id="anomalyGrid"></div>
  </div>

<script>
(function () {
  var API_BASE_URL = (location.protocol === 'file:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1') ? 'http://127.0.0.1:8000' : 'https://PALITAN-MO-ITO.onrender.com';

  var anomalies = [];
  var grid = document.getElementById('anomalyGrid');
  var apiErrorEl = document.getElementById('apiError');
  var exportBtn = document.getElementById('exportBtn');

  function escapeHtml(str) {
    return String(str).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  function formatDate(iso) {
    var d = new Date(iso);
    if (isNaN(d.getTime())) return '';
    return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
  }

  function shortId(recordId) {
    return 'REC-' + String(recordId).replace(/-/g, '').slice(0, 8).toUpperCase();
  }

  function setMessage(text) {
    grid.innerHTML = '';
    var note = document.createElement('div');
    note.className = 'empty-note';
    note.textContent = text;
    grid.appendChild(note);
  }

  function render(list) {
    grid.innerHTML = '';
    if (!list.length) {
      setMessage('No flagged anomalies to show.');
      return;
    }
    list.forEach(function (a) {
      var card = document.createElement('div');
      card.className = 'anomaly-card';
      card.innerHTML =
        '<div class="anomaly-top">' +
          '<span class="anomaly-id">' + escapeHtml(a.id) + '</span>' +
          '<span class="anomaly-kg">' + a.kg.toFixed(1) + ' kg</span>' +
        '</div>' +
        '<p class="anomaly-desc">' + escapeHtml(a.desc) + '</p>' +
        '<div class="anomaly-meta">' +
          '<span>' + escapeHtml(a.date) + '</span>' +
          '<span>Score: ' + a.score.toFixed(2) + '</span>' +
        '</div>';
      grid.appendChild(card);
    });
  }

  // RFC 4180: wrap every field in quotes and double any embedded quotes,
  // so values containing commas (e.g. "Sep 16, 2026") stay in one column.
  function csvField(value) {
    return '"' + String(value).replace(/"/g, '""') + '"';
  }

  function toCSV(list) {
    var rows = [['id', 'kg_co2e', 'description', 'date', 'score']];
    list.forEach(function (a) {
      rows.push([a.id, a.kg, a.desc, a.date, a.score]);
    });
    return rows.map(function (r) { return r.map(csvField).join(','); }).join('\r\n');
  }

  exportBtn.addEventListener('click', function () {
    var csv = toCSV(anomalies);
    var blob = new Blob([csv], { type: 'text/csv' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = 'flagged-anomalies.csv';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  });

  function load() {
    setMessage('Loading flagged anomalies…');
    fetch(API_BASE_URL + '/api/anomalies')
      .then(function (res) {
        if (!res.ok) throw new Error('Server responded with ' + res.status);
        return res.json();
      })
      .then(function (data) {
        apiErrorEl.style.display = 'none';
        anomalies = (data.anomalies || []).map(function (r) {
          return {
            id: shortId(r.record_id),
            kg: Number(r.total_co2e),
            desc: r.explanation,
            date: formatDate(r.submitted_at),
            score: Number(r.anomaly_score)
          };
        });
        if (!data.has_mining_run) {
          setMessage('Analysis has not been run yet. Flagged records will appear here once enough data has been collected and analysed.');
          return;
        }
        render(anomalies);
      })
      .catch(function (err) {
        anomalies = [];
        grid.innerHTML = '';
        apiErrorEl.textContent = 'Could not reach the server: ' + err.message + '. Make sure uvicorn is running.';
        apiErrorEl.style.display = 'block';
      });
  }

  load();
})();
</script>

</body>
</html>
